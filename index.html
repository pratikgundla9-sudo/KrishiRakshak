<script>
  // Automatic Phone Stream Overrider for KrishiRakshak
  setInterval(() => {
    // 1. Target any video element in the camera view
    const video = document.querySelector('video');
    if (video && !video.dataset.replaced) {
      video.dataset.replaced = "true";
      video.pause();
      video.style.display = 'none';

      // 2. Insert the direct phone MJPEG stream
      let img = document.getElementById('phone-live-feed');
      if (!img) {
        img = document.createElement('img');
        img.id = 'phone-live-feed';
        img.src = 'http://localhost:8080/video_feed';
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.maxHeight = '480px';
        img.style.objectFit = 'contain';
        img.style.borderRadius = '8px';
        img.style.background = '#000';
        video.parentNode.insertBefore(img, video);
      }
    }

    // 3. Keep Capture Leaf Image functional
    const captureBtn = Array.from(document.querySelectorAll('button')).find(b => b.innerText.includes('Capture'));
    if (captureBtn && !captureBtn.dataset.hooked) {
      captureBtn.dataset.hooked = "true";
      captureBtn.addEventListener('click', () => {
        const img = document.getElementById('phone-live-feed');
        if (img) {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth || 640;
          canvas.height = img.naturalHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          console.log("Captured leaf snapshot successfully!");
        }
      });
    }
  }, 500);
</script>
